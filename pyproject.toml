[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moodle-automation"
version = "1.0.0"
description = "Production-quality Moodle Assignment Automation System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Aditya Agarwal" }
]
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "reportlab>=4.1.0",
    "pillow>=10.2.0",
    "pygments>=2.17.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "playwright>=1.42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
moodle-auto = "app.main:app"

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
python_files = ["test_*.py"]


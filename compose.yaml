services:
  postgres:
    image: postgres:16-alpine
    container_name: moodle_automation_db
    environment:
      POSTGRES_DB: moodle_db
      POSTGRES_USER: moodle_user
      POSTGRES_PASSWORD: moodle_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U moodle_user -d moodle_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: moodle_automation_redis
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moodle_automation_worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://moodle_user:moodle_password@postgres:5432/moodle_db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - moodle_data:/app/data
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  moodle_data:

